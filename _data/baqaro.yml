# Single source of truth for every BAQARO link on the site.
# Leave a value empty ("") and the page renders it as "in preparation"
# instead of a dead link. Fill these in one place when they exist.

version:   "1.0"
code_url:  "https://github.com/eliapizzati/baqaro"
docs_url:  "https://github.com/eliapizzati/baqaro/tree/main/docs"
data_url:  ""            # DOI landing page for the data release
data_doi:  ""            # e.g. 10.5281/zenodo.XXXXXXX
paper_url: ""            # arXiv abstract page
paper_ads: ""            # ADS bibcode link

# Adopted best fit, quoted from the release provenance.
# NB single quotes: YAML processes backslash escapes inside DOUBLE quotes,
#     which would eat the LaTeX. Single-quoted scalars pass through as typed.
params:
  - { sym: '\eta_0', val: '-1.2355', desc: 'mean log Eddington ratio at zero cold specific accretion rate' }
  - { sym: '\eta_{\rm evol}', val: '+0.8327', desc: 'dependence of that mean on the cold specific accretion rate' }
  - { sym: '\sigma_0', val: '+0.5075', desc: 'scatter of the Eddington-ratio distribution [dex]' }
  - { sym: '\log \tau', val: '+5.8947', desc: 'accretion coherence time [log yr]' }
  - { sym: '\log f_{\rm seed}', val: '-6.4694', desc: 'seed black hole to halo mass ratio [log]' }
  - { sym: '\sigma_{\rm seed}', val: '+0.5056', desc: 'scatter on the seed mass ratio [dex]' }

# Contents of the release, for data.html. Sizes are the built bundle.
release:
  total: '12 GB'
  items:
    - { dir: '00_statistics', size: '360 kB', name: 'Summary statistics',
        what: 'The four emulated quantities on the model grids at 41 redshifts, plus the mean and seven percentiles of the Eddington ratio, accretion ratio and host accretion rate for three nested populations.' }
    - { dir: '01_emulator', size: '8 MB', name: 'Portable emulators',
        what: 'One Gaussian-process emulator per statistic, as plain HDF5 arrays, with a reference implementation that needs only numpy and h5py. No pickles, so they outlive any library version.' }
    - { dir: '02_posterior', size: '333 MB', name: 'MCMC chains',
        what: 'Four likelihood combinations, 100,000 steps by 50 walkers, readable with emcee.' }
    - { dir: '03_catalogue', size: '7.6 GB', name: 'Quasar catalogue',
        what: '41 snapshot files, 360 million objects. Per object: black hole mass, bolometric luminosity, host halo mass, Eddington ratio, accretion ratio, host specific accretion rate, statistical weight and a track id.' }
    - { dir: '04_histories', size: '3.5 GB', name: 'Individual histories',
        what: 'Finely time-sampled growth tracks and light curves for selected black holes, with their merger trees. The one thing the snapshot catalogue cannot give you.' }
    - { dir: '05_examples', size: '52 kB', name: 'Worked examples',
        what: 'The scripts that produce every figure in the release. Run them to reproduce the plots, then edit them.' }
